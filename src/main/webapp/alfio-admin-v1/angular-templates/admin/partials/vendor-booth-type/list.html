<div class="container">
    <div class="page-header">
        <h1>Vendor Booth Types</h1>
        <small class="text-muted">Here you can manage the vendor booth types for the current event</small>
    </div>
    <div class="wMarginTop wMarginBottom">
        <div class="page-header">
            <h3><i class="fa fa-list"></i> List of Vendor Booth Types</h3>
        </div>
        <div>
            <button class="btn btn-success" ng-click="ctrl.addOrEditBoothType">Add new booth type</button>
        </div>

        <div class="row">
            <div class="col-xs-12 col-md-4">
                <div class="form-group">
                    <div class="input-group">
                        <div class="input-group-addon"><i class="fa fa-search"></i></div>
                        <input type="text" class="form-control" placeholder="Filter table" data-ng-model="ctrl.toSearch" ng-change="ctrl.updateFilteredData()" ng-model-options='{ debounce: 1000 }'>
                    </div>
                </div>
            </div>
        </div>
        <div class="clearfix"></div>
        <div class="wMarginTop wMarginBottom" data-ng-if="ctrl.boothTypes.length == 0">
            <h3><i class="fa fa-close"></i> No booth types found.</h3>
        </div>

        <div class="table-responsive" data-ng-if="ctrl.boothTypes.length > 0">
            <table class="table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr data-ng-repeat="boothType in ctrl.boothTypes">
                    <td>{{::boothType.name}}</td>
                    <td>{{::boothType.description}}</td>
                    <td>{{::boothType.price | currency}}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" ng-click="ctrl.addOrEditBoothType(boothType)"><i class="fa fa-pencil"></i> Edit</button>
                        <button class="btn btn-danger btn-sm" ng-click="ctrl.deleteBoothType(boothType.id)">Delete</button>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="text-center wMarginBottom" data-ng-if="ctrl.contextType === 'event'">
                <a href="#" data-ui-sref="^.detail" class="btn btn-default">back</a>
            </div>

        </div>
</div>
