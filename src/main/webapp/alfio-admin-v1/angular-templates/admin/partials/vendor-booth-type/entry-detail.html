<div class="page-header">
    <h1>Vendor Booth Type Details</h1>
</div>
<div class="container">
    <dl data-ng-if="detailCtrl.boothType">
        <dt>Name</dt>
        <dd>{{detailCtrl.boothType.name}}</dd>
        <dt>Description</dt>
        <dd>{{detailCtrl.boothType.description}}</dd>
        <dt>Price</dt>
        <dd>{{detailCtrl.boothType.price | currency}}</dd>
    </dl>
    <div class="text-center wMarginBottom">
        <a class="btn btn-default" href="#" data-ui-sref="^.vendor-booth-types({eventName: detailCtrl.publicIdentifier})">back to list</a>
    </div>
</div>
